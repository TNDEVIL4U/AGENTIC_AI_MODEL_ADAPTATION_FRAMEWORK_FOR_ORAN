[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oran-adapt"
version = "0.1.0"
description = "Agentic AI-based model adaptation / regeneration framework for O-RAN"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6", "pydantic-settings>=2.2",
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1",
  "mlflow>=2.12", "scikit-learn>=1.4", "torch>=2.2", "xgboost>=2.0",
  "joblib>=1.3", "numpy", "pandas", "onnx", "safetensors",
  "anthropic>=0.30", "google-genai>=0.3", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["integration: needs external services (PostgreSQL/Docker)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

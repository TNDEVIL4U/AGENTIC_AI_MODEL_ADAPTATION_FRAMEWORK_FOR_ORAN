[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oran-adapt"
version = "0.1.0"
description = "Agentic AI-based model adaptation / regeneration framework for O-RAN"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6", "pydantic-settings>=2.2",
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1",
  "mlflow>=2.12", "scikit-learn>=1.4", "torch>=2.2", "xgboost>=2.0",
  "joblib>=1.3", "numpy", "pandas", "onnx", "safetensors",
  "anthropic>=0.30", "google-genai>=0.3", "httpx>=0.27", "evidently>=0.7",
  "prometheus-client>=0.20",
]

[project.scripts]
oran-adapt = "oran_adapt.cli:main"

# Adapters, one entry-point group per port (oran_adapt.plugins). A third-party distribution adds
# its own under the same groups; the config key naming the adapter selects it.
[project.entry-points."oran_adapt.registry"]
mlflow = "oran_adapt.adapters.registry.mlflow:SPEC"
filesystem = "oran_adapt.adapters.registry.filesystem:SPEC"
mirror = "oran_adapt.adapters.registry.mirror:SPEC"
sagemaker = "oran_adapt.adapters.registry.sagemaker:SPEC"
vertex = "oran_adapt.adapters.registry.vertex:SPEC"

[project.entry-points."oran_adapt.artifact_store"]
filesystem = "oran_adapt.adapters.registry.artifact_stores:FILESYSTEM"
fsspec = "oran_adapt.adapters.registry.artifact_stores:FSSPEC"

[project.entry-points."oran_adapt.model_handler"]
mlflow-flavors = "oran_adapt.adapters.registry.mlflow.flavors:SPEC"
native = "oran_adapt.adapters.handlers.native:SPEC"

[project.entry-points."oran_adapt.model_type"]
catboost = "oran_adapt.adapters.model_types.tabular:CATBOOST"
keras = "oran_adapt.adapters.model_types.sequence:KERAS"
lightgbm = "oran_adapt.adapters.model_types.tabular:LIGHTGBM"
onnx = "oran_adapt.adapters.model_types.onnx:SPEC"
sklearn = "oran_adapt.adapters.model_types.tabular:SKLEARN"
statsmodels = "oran_adapt.adapters.model_types.forecasters:SPEC"
torch = "oran_adapt.adapters.model_types.tabular:TORCH"
torch-sequence = "oran_adapt.adapters.model_types.sequence:TORCH_SEQUENCE"
xgboost = "oran_adapt.adapters.model_types.tabular:XGBOOST"

[project.entry-points."oran_adapt.llm"]
anthropic = "oran_adapt.adapters.llm_providers:ANTHROPIC"
gemini = "oran_adapt.adapters.llm_providers:GEMINI"

[project.entry-points."oran_adapt.cdc_source"]
kafka = "oran_adapt.adapters.kafka_cdc:SPEC"
polling = "oran_adapt.adapters.polling_cdc:SPEC"

[project.entry-points."oran_adapt.job_executor"]
process = "oran_adapt.adapters.job_executors:PROCESS"
thread = "oran_adapt.adapters.job_executors:THREAD"

[project.entry-points."oran_adapt.job_queue"]
database = "oran_adapt.adapters.job_queues:DATABASE"
inline = "oran_adapt.adapters.job_queues:INLINE"
celery = "oran_adapt.adapters.job_queues:CELERY"
rq = "oran_adapt.adapters.job_queues:RQ"
kubernetes = "oran_adapt.adapters.job_queues:KUBERNETES"

[project.entry-points."oran_adapt.auth"]
api-key = "oran_adapt.adapters.access:API_KEY"

[project.entry-points."oran_adapt.policy"]
static-rbac = "oran_adapt.adapters.access:STATIC_RBAC"

[project.entry-points."oran_adapt.notification"]
log = "oran_adapt.adapters.notify:LOG"
webhook = "oran_adapt.adapters.notify:WEBHOOK"
slack = "oran_adapt.adapters.notify:SLACK"
pagerduty = "oran_adapt.adapters.notify:PAGERDUTY"
email = "oran_adapt.adapters.notify_email:EMAIL"
kafka = "oran_adapt.adapters.notify_brokers:KAFKA"
sqs = "oran_adapt.adapters.notify_brokers:SQS"
sns = "oran_adapt.adapters.notify_brokers:SNS"
pubsub = "oran_adapt.adapters.notify_brokers:PUBSUB"
nats = "oran_adapt.adapters.notify_brokers:NATS"

[project.entry-points."oran_adapt.secrets"]
env = "oran_adapt.adapters.secrets:ENV"
file = "oran_adapt.adapters.secrets:FILE"

[project.entry-points."oran_adapt.deployment"]
registry-alias = "oran_adapt.adapters.deployment.alias:SPEC"
webhook = "oran_adapt.adapters.deployment.webhook:WEBHOOK"
bentoml = "oran_adapt.adapters.deployment.webhook:BENTOML"
gitops = "oran_adapt.adapters.deployment.gitops:SPEC"
kserve = "oran_adapt.adapters.deployment.kubernetes:KSERVE"
seldon = "oran_adapt.adapters.deployment.kubernetes:SELDON"
k8s = "oran_adapt.adapters.deployment.kubernetes:K8S"
triton = "oran_adapt.adapters.deployment.triton:SPEC"
sagemaker = "oran_adapt.adapters.deployment.sagemaker:SPEC"
vertex = "oran_adapt.adapters.deployment.vertex:SPEC"

[project.entry-points."oran_adapt.dataset"]
file = "oran_adapt.adapters.datasets:FILE"
http = "oran_adapt.adapters.datasets:HTTP"
fsspec = "oran_adapt.adapters.datasets:FSSPEC"
s3 = "oran_adapt.adapters.datasets_cloud:S3"
gcs = "oran_adapt.adapters.datasets_cloud:GCS"

[project.entry-points."oran_adapt.rollout_metrics"]
api = "oran_adapt.adapters.rollout_metrics:API"
prometheus = "oran_adapt.adapters.rollout_metrics:PROMETHEUS"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov", "pytest-xdist>=3.8", "ruff"]
# CDC_MODE=kafka (production CDC from Debezium). Not needed for the polling fallback.
kafka = ["confluent-kafka>=2.3"]
# ARTIFACT_STORE_BACKEND=fsspec; add the filesystem driver for the URL (s3fs, gcsfs, adlfs).
object-store = ["fsspec>=2023.1"]
# REGISTRY_BACKEND=sagemaker.
sagemaker = ["boto3>=1.28"]
# REGISTRY_BACKEND=vertex (Application Default Credentials).
vertex = ["google-auth>=2.20"]
# NOTIFICATION_BACKEND=sqs / sns, DATASET_BACKENDS=s3.
aws = ["boto3>=1.28"]
# DATASET_BACKENDS=fsspec; add the filesystem driver for the URIs (sftp: paramiko, abfs: adlfs).
fsspec = ["fsspec>=2023.1"]
# Parquet data versions registered by reference (DATASET_BACKENDS).
parquet = ["pyarrow>=14"]
# NOTIFICATION_BACKEND=pubsub with NOTIFICATION_PUBSUB_CREDENTIALS=adc.
pubsub = ["google-auth>=2.20"]
# JOB_QUEUE_BACKEND=celery / rq (workers woken through a broker).
celery = ["celery>=5.3"]
rq = ["rq>=1.15", "redis>=5"]
# scripts/security_check.py: static security scan, dependency audit, type check, SBOM.
security = ["bandit[toml]>=1.8", "pip-audit>=2.9", "mypy>=1.15", "cyclonedx-bom>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
# Tiers: smoke (whole tier < 60 s), unmarked gate tests (scoped run < 5 min, scripts/verify.sh)
# and heavy (end-to-end pipelines, worker processes; excluded by default, run in CI with
# -m "heavy or not heavy").
addopts = '-m "not heavy"'
markers = [
    "integration: needs external services (PostgreSQL/Docker)",
    "smoke: fast unit tests, the whole tier runs in under 60 s",
    "heavy: slow end-to-end tests; never part of a phase gate, always run in CI",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]
# B101 (assert): the asserts in src/ only narrow Optional types for the type checker; each
# invariant is already enforced elsewhere (e.g. the Settings validator), so -O changes nothing.
skips = ["B101"]

[tool.mypy]
# The deployed target: the Docker image is Linux + Python 3.13 (numpy's stubs need >= 3.12).
python_version = "3.13"
platform = "linux"
mypy_path = "src"
files = ["src/oran_adapt"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

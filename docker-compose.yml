services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oran
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: oran_adapt
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oran -d oran_adapt"]
      interval: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    volumes: [mlflowdata:/mlflow]
    ports: ["5000:5000"]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://oran:${POSTGRES_PASSWORD}@postgres:5432/oran_adapt
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres: {condition: service_healthy}
      mlflow: {condition: service_started}
    ports: ["8000:8000"]

volumes:
  pgdata:
  mlflowdata:

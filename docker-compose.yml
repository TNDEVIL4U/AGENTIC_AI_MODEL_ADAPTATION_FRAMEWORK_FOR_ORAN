# Full oran-adapt stack: PostgreSQL (app data + CDC source), MLflow (registry; artifacts on a volume),
# Kafka + Debezium (production CDC), the API, the job worker, the CDC consumer, and Prometheus.
#
#   export POSTGRES_PASSWORD=...   # or put it in .env (cp .env.example .env)
#   docker compose up -d --build --wait
#   bash scripts/ci/compose_smoke.sh   # what CI runs from a fresh clone
#
# `migrate` applies the migrations once and exits; the API, the worker and the connector setup
# start only after it succeeded (the API never migrates). Every pulled image is pinned by tag and
# digest; the images built here pin their base by digest and their Python packages by
# requirements.lock. Published ports bind to 127.0.0.1 only. See docs/DEPLOYMENT.md and
# docs/CDC.md.

x-app: &app
  env_file:
    - path: .env
      required: false  # a fresh clone runs on the defaults plus POSTGRES_PASSWORD
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://oran:${POSTGRES_PASSWORD}@postgres:5432/oran_adapt
    MLFLOW_TRACKING_URI: http://mlflow:5000
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  restart: unless-stopped

x-migrated: &migrated
  migrate: {condition: service_completed_successfully}

services:
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: oran
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: oran_adapt
    # Logical decoding for Debezium (pgoutput).
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4",
              "-c", "max_replication_slots=4"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-mlflow.sql:/docker-entrypoint-initdb.d/10-mlflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oran -d oran_adapt"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  mlflow:
    build: docker/mlflow
    image: oran-adapt-mlflow:3.16.1
    environment:
      MLFLOW_BACKEND_URI: postgresql+psycopg://oran:${POSTGRES_PASSWORD}@postgres:5432/mlflow
    command:
      - sh
      - -c
      - exec mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri "$$MLFLOW_BACKEND_URI"
        --artifacts-destination /mlartifacts --serve-artifacts
        --allowed-hosts "mlflow:5000,localhost:5000,127.0.0.1:5000"
    # Artifacts live on a named volume; --serve-artifacts proxies them, so clients need no
    # storage credentials or shared filesystem.
    volumes: [mlartifacts:/mlartifacts]
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 10s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  kafka:  # single-node KRaft broker (no ZooKeeper)
    image: apache/kafka:3.8.0@sha256:c89f315cff967322c5d2021434b32271393cb193aa7ec1d43e97341924e57069
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      start_period: 20s
      retries: 20
    restart: unless-stopped

  debezium:  # Kafka Connect with the Debezium PostgreSQL connector
    image: quay.io/debezium/connect:2.7.3.Final@sha256:a51bbb3a08d0de2cd56f76b956060bdaa3beb112ec13dac2668886b92dd5dd0b
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: oran-connect
      CONFIG_STORAGE_TOPIC: oran_connect_configs
      OFFSET_STORAGE_TOPIC: oran_connect_offsets
      STATUS_STORAGE_TOPIC: oran_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Lets the connector config say ${env:POSTGRES_PASSWORD} instead of holding the secret.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:8083:8083"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/connectors"]
      interval: 10s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  debezium-init:  # one-shot: create or update the kpi_sample connector (PUT is idempotent)
    image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
    depends_on:
      <<: *migrated  # the migrations create kpi_sample
      debezium: {condition: service_healthy}
    volumes: ["./deploy/debezium/kpi-connector.json:/connector.json:ro"]
    command: ["-fsS", "-X", "PUT", "-H", "Content-Type: application/json",
              "--data", "@/connector.json",
              "http://debezium:8083/connectors/oran-kpi-sample/config"]
    restart: "no"

  migrate:  # one-shot: `oran-adapt db upgrade` (expand-only migrations: docs/operations/migrations.md)
    <<: *app
    build: {context: ., target: migrator}
    image: oran-adapt-migrator:0.1.0
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    build: {context: ., target: api}
    image: oran-adapt-api:0.1.0
    ports: ["127.0.0.1:8000:8000"]
    stop_grace_period: 30s  # > UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN
    depends_on:
      <<: *migrated
      mlflow: {condition: service_healthy}

  cdc-consumer:  # reads Debezium's topic into cdc_event (CDC_MODE=kafka)
    <<: *app
    build: {context: ., target: worker}
    image: oran-adapt-worker:0.1.0
    environment:
      <<: *app-env
      CDC_MODE: kafka
    command: ["oran-adapt", "cdc", "run", "--mode", "kafka"]
    healthcheck: {disable: true}  # the image's check is the job worker's liveness file
    depends_on:
      <<: *migrated
      kafka: {condition: service_healthy}

  worker:  # claims and runs the adaptation jobs the API queues (docs/adapters/job_queue.md)
    <<: *app
    build: {context: ., target: worker}
    image: oran-adapt-worker:0.1.0
    stop_grace_period: 45s  # > JOB_DRAIN_TIMEOUT_S: a stopping worker requeues its job
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9100"  # job, queue and rollout metrics; scraped by prometheus
    depends_on:
      <<: *migrated
      mlflow: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  mlartifacts:
  kafkadata:
  promdata:

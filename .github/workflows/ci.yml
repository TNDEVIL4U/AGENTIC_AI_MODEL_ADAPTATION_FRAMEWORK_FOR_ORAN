# CI for every commit and pull request (Hardening Phase 0).
#
#   quality            ruff, mypy (ratchet at 0 errors), full pytest suite with coverage
#   build-images       builds the api, mlflow and sandbox images
#   phase-0-baseline   compose stack from a clean checkout -> health, readiness, metrics,
#                      one drift event + duplicate, job read-back -> teardown
#                      (scripts/ci/compose_smoke.sh)
#
# Everything runs CPU-only on GitHub-hosted runners; nothing here needs the development laptop.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.7"
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  # Dev tools are pinned to the versions the suite was last run with locally.
  DEV_TOOLS: >-
    pytest==9.1.1 pytest-asyncio==1.4.0 pytest-cov==7.1.0 coverage==7.16.1
    ruff==0.16.8 mypy==2.3.1
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (locked runtime deps + pinned dev tools)
        run: |
          python -m pip install --upgrade "pip>=26.2"
          pip install --extra-index-url "$TORCH_INDEX_URL" -c requirements.lock -e .
          pip install $DEV_TOOLS
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type check (mypy)
        run: mypy
      - name: Tests with coverage
        env:
          CUDA_VISIBLE_DEVICES: ""
          LLM_PROVIDER: none
        run: |
          pytest -p no:cacheprovider -rs \
            --cov=oran_adapt --cov-report=term --cov-report=xml:coverage.xml \
            --junitxml=junit.xml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml

  build-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        run: docker build --tag oran-adapt:ci .
      - name: Build mlflow image
        run: docker build --tag oran-adapt-mlflow:ci docker/mlflow
      - name: Build sandbox image
        run: docker build --tag oran-adapt-sandbox:ci docker/sandbox
      - name: Container smoke (api image imports and runs as non-root)
        run: |
          docker run --rm --entrypoint sh oran-adapt:ci -c \
            'test "$(id -u)" != "0" && python -c "import oran_adapt, oran_adapt.api.main; print(oran_adapt.__version__)"'

  phase-0-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Compose smoke (clean bring-up, endpoints, one event, teardown)
        run: bash scripts/ci/compose_smoke.sh

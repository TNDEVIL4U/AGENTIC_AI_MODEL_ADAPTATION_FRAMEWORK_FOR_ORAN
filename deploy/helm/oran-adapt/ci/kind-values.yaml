# Values for the scheduled kind end-to-end run (scripts/ci/kind_e2e.sh). The images are built by
# the run and loaded into the kind node under the tag `e2e`; the database is a throwaway
# PostgreSQL in the same namespace. The Secret `oran-adapt-e2e-env` holds DATABASE_URL,
# MLFLOW_TRACKING_URI and API_KEYS, written by the script with random credentials.
image:
  tag: e2e
  pullPolicy: Never
config:
  env:
    ENVIRONMENT: development
    LOG_LEVEL: INFO
    ARTIFACT_WORKDIR: /tmp/oran-adapt/artifacts
    SANDBOX_BACKEND: subprocess
    LLM_ENABLED: "false"
secrets:
  existingSecret: oran-adapt-e2e-env
api:
  replicas: 1
  autoscaling: {enabled: false}
  pdb: {enabled: true, minAvailable: 0}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
workers:
  - name: default
    classes: [default]
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 2Gi}
networkPolicy:
  enabled: true
  apiIngressFrom:
    - podSelector: {}

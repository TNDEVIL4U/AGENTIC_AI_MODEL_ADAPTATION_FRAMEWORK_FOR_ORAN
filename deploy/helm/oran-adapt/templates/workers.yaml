{{- range $i, $w := .Values.workers }}
{{- if $i }}
---
{{- end }}
# Workers of the queue classes {{ join ", " $w.classes }} (JOB_WORKER_CLASSES).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oran-adapt.fullname" $ }}-worker-{{ $w.name }}
  labels:
    {{- include "oran-adapt.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    oran-adapt/worker-pool: {{ $w.name }}
spec:
  replicas: {{ $w.replicas }}
  selector:
    matchLabels:
      {{- include "oran-adapt.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: worker
      oran-adapt/worker-pool: {{ $w.name }}
  template:
    metadata:
      labels:
        {{- include "oran-adapt.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: worker
        oran-adapt/worker-pool: {{ $w.name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") $ | sha256sum }}
        {{- with $.Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "oran-adapt.serviceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      # SIGTERM drains: no new claims; the running job gets JOB_DRAIN_TIMEOUT_S, then is requeued.
      terminationGracePeriodSeconds: {{ $.Values.worker.terminationGracePeriodS }}
      initContainers:
        {{- include "oran-adapt.waitForSchema" $ | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "oran-adapt.image" (dict "root" $ "image" $.Values.image.worker) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - {name: JOB_WORKER_CLASSES, value: {{ $w.classes | toJson | quote }}}
            - {name: WORKER_HEALTH_FILE, value: {{ $.Values.worker.healthFile | quote }}}
            {{- range $key, $value := $w.env }}
            - {name: {{ $key }}, value: {{ $value | toString | quote }}}
            {{- end }}
          envFrom:
            {{- include "oran-adapt.envFrom" $ | nindent 12 }}
          livenessProbe:
            exec:
              command: ["oran-adapt", "worker", "health"]
            {{- toYaml $.Values.worker.probes.liveness | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "oran-adapt.tmpVolume" $ | nindent 8 }}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

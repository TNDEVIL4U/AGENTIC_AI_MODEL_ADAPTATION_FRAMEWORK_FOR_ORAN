{{- with .Values.metrics.serviceMonitor }}
{{- if .enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "oran-adapt.fullname" $ }}-api
  labels:
    {{- include "oran-adapt.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "oran-adapt.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: {{ $.Values.metrics.path }}
      interval: {{ .interval }}
{{- end }}
{{- end }}
{{- with .Values.metrics.prometheusRule }}
{{- if .enabled }}
---
# The alert rules as code (files/prometheus-rules.yaml); each alert names its runbook.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "oran-adapt.fullname" $ }}
  labels:
    {{- include "oran-adapt.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- $.Files.Get "files/prometheus-rules.yaml" | nindent 2 }}
{{- end }}
{{- end }}
{{- with .Values.metrics.podMonitor }}
{{- if .enabled }}
---
# The workers' metrics port (worker.metricsPort, WORKER_METRICS_PORT): job, queue, stage,
# adapter and rollout metrics are only in the workers' processes.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "oran-adapt.fullname" $ }}-worker
  labels:
    {{- include "oran-adapt.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "oran-adapt.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: worker
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .interval }}
{{- end }}
{{- end }}
{{- with .Values.metrics.dashboards }}
{{- if .enabled }}
---
# Grafana dashboards as code (files/dashboards/*.json), picked up by the Grafana sidecar
# through the label below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oran-adapt.fullname" $ }}-dashboards
  labels:
    {{- include "oran-adapt.labels" $ | nindent 4 }}
    {{ .label }}: {{ .labelValue | quote }}
data:
  {{- range $path, $_ := $.Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}

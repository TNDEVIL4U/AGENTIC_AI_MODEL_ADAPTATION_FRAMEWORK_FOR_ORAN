{{- $api := .Values.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oran-adapt.fullname" . }}-api
  labels:
    {{- include "oran-adapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not $api.autoscaling.enabled }}
  replicas: {{ $api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oran-adapt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "oran-adapt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
        {{- with $api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "oran-adapt.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $api.terminationGracePeriodS }}
      initContainers:
        {{- include "oran-adapt.waitForSchema" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "oran-adapt.image" (dict "root" . "image" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: UVICORN_PORT, value: {{ $api.port | toString | quote }}}
            - {name: UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN, value: {{ $api.gracefulShutdownS | toString | quote }}}
          envFrom:
            {{- include "oran-adapt.envFrom" . | nindent 12 }}
          ports:
            - {name: http, containerPort: {{ $api.port }}, protocol: TCP}
          startupProbe:
            httpGet: {path: /api/v1/health, port: http}
            {{- toYaml $api.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            {{- toYaml $api.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: {path: /api/v1/ready, port: http}
            {{- toYaml $api.probes.readiness | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ $api.preStopSleepS | toString | quote }}]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $api.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "oran-adapt.tmpVolume" . | nindent 8 }}
      {{- with $api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oran-adapt.fullname" . }}-api
  labels:
    {{- include "oran-adapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ $api.service.type }}
  selector:
    {{- include "oran-adapt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: {{ $api.service.port }}, targetPort: http, protocol: TCP}
{{- if $api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "oran-adapt.fullname" . }}-api
  labels:
    {{- include "oran-adapt.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "oran-adapt.fullname" . }}-api
  minReplicas: {{ $api.autoscaling.minReplicas }}
  maxReplicas: {{ $api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if $api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "oran-adapt.fullname" . }}-api
  labels:
    {{- include "oran-adapt.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "oran-adapt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}

{{- with .Values.secrets.externalSecret }}
{{- if .enabled }}
# Syncs the pods' Secret from the operator's secret store (external-secrets.io). A hook that
# runs before the migration hook, since that Job needs the Secret; recreated on each upgrade. The
# Secret is orphaned, not owned, so recreating the ExternalSecret never deletes it under running
# pods (on uninstall, delete the ExternalSecret and the Secret by hand: docs/operations/helm.md).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "oran-adapt.fullname" $ }}-env
  labels:
    {{- include "oran-adapt.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    kind: {{ .secretStoreRef.kind }}
    name: {{ required "secrets.externalSecret.secretStoreRef.name is required" .secretStoreRef.name }}
  target:
    name: {{ include "oran-adapt.secretName" $ }}
    creationPolicy: Orphan
  data:
    {{- range $envKey, $remote := .data }}
    - secretKey: {{ $envKey }}
      remoteRef:
        key: {{ $remote.key }}
        {{- with $remote.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}

# A single-node development cluster (kind, k3d): one replica of everything, no autoscaling,
# images loaded into the cluster by name, the Secret created by hand:
#   kubectl create secret generic oran-adapt-dev-env \
#     --from-literal=DATABASE_URL=postgresql+psycopg://... --from-literal=API_KEYS='{}'
image:
  tag: dev
  pullPolicy: Never
config:
  env:
    ENVIRONMENT: development
    LOG_LEVEL: DEBUG
    ARTIFACT_WORKDIR: /tmp/oran-adapt/artifacts
    SANDBOX_BACKEND: subprocess
adapters:
  registry:
    env: {REGISTRY_BACKEND: mlflow, MLFLOW_TRACKING_URI: "http://mlflow:5000"}
secrets:
  existingSecret: oran-adapt-dev-env
api:
  replicas: 1
  autoscaling: {enabled: false}
  pdb: {enabled: false}
workers:
  - name: default
    classes: [default]
    replicas: 1
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 2Gi}
networkPolicy:
  enabled: false

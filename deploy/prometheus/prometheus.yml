# Scrapes the API's Prometheus endpoint. /api/v1/metrics needs no API key while
# METRICS_PUBLIC=true (the default); with METRICS_PUBLIC=false, add an authorization block
# with a key whose role may read metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: oran-adapt-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

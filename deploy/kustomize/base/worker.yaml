# One pool (class `default`). An overlay adds a pool by copying this Deployment under another
# name with its own JOB_WORKER_CLASSES and scheduling; the Helm chart's `workers` list is the
# shorter way.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oran-adapt-worker-default
  labels: {app.kubernetes.io/component: worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: worker, oran-adapt/worker-pool: default}
  template:
    metadata:
      labels: {app.kubernetes.io/component: worker, oran-adapt/worker-pool: default}
    spec:
      serviceAccountName: oran-adapt
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # SIGTERM drains: no new claims; the running job gets JOB_DRAIN_TIMEOUT_S, then is requeued.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-schema
          image: oran-adapt-migrator
          command: ["oran-adapt", "db", "wait"]
          envFrom:
            - configMapRef: {name: oran-adapt-config}
            - secretRef: {name: oran-adapt-env}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      containers:
        - name: worker
          image: oran-adapt-worker
          env:
            - {name: JOB_WORKER_CLASSES, value: '["default"]'}
            - {name: WORKER_HEALTH_FILE, value: /tmp/oran-adapt/worker.alive}
            - {name: WORKER_METRICS_PORT, value: "9100"}
          envFrom:
            - configMapRef: {name: oran-adapt-config}
            - secretRef: {name: oran-adapt-env}
          ports:
            - {name: metrics, containerPort: 9100, protocol: TCP}
          livenessProbe:
            exec: {command: ["oran-adapt", "worker", "health"]}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 4Gi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 2Gi}}]

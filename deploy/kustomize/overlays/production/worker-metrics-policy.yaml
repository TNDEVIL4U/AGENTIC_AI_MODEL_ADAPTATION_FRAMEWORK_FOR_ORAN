# The monitoring namespace may scrape the workers' metrics port (WORKER_METRICS_PORT).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oran-adapt-worker-metrics
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: worker}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {port: 9100, protocol: TCP}
